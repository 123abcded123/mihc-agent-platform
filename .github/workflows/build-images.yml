name: build-images

# 后端 + 前端镜像构建，推送到 GitHub Container Registry（ghcr.io）
# 触发：GitHub 网页 Actions → Build Images → Run workflow；或推送 main 分支
on:
  workflow_dispatch:
    inputs:
      vite_api_base:
        description: '前端调用的后端公网地址（可选，留空则前端同源）'
        required: false
        default: ''
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mihc-backend:latest

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          build-args: |
            VITE_API_BASE=${{ github.event.inputs.vite_api_base }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mihc-frontend:latest
