# MIHC 前端服务（Sealos：Vue3 构建产物 + nginx）
# 使用前替换 IMAGE_PLACEHOLDER 为你的镜像地址。
# 端口 3000，公网域名示例：https://fgditvzngxkq.sealoshzh.site
# 注意：构建前端镜像时必须传入 VITE_API_BASE=后端公网地址
#   docker build --build-arg VITE_API_BASE=https://pjivqevoppjt.sealoshzh.site -f Dockerfile.frontend .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mihc-frontend
  namespace: ns-364w8lhf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mihc-frontend
  template:
    metadata:
      labels:
        app: mihc-frontend
    spec:
      containers:
        - name: frontend
          image: IMAGE_PLACEHOLDER   # 例如 docker.io/<user>/mihc-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mihc-frontend
  namespace: ns-364w8lhf
spec:
  selector:
    app: mihc-frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mihc-frontend
  namespace: ns-364w8lhf
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: fgditvzngxkq.sealoshzh.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mihc-frontend
                port:
                  number: 3000
