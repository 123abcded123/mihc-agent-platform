# MIHC 医疗科研智能 Agent 平台 —— 生产基础设施
# 本机无 Docker 时全部组件自动回退本地实现（milvus-lite/BM25/SQLite/fakeredis/JSON）
# 有 Docker 的环境执行: docker compose up -d
version: "3.8"

services:
  # ========== 检索 ==========
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: ["es_data:/usr/share/elasticsearch/data"]

  milvus:
    image: milvusdb/milvus:v2.4.10
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["19530:19530", "9091:9091"]
    depends_on: [etcd, minio]

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["etcd_data:/etcd"]

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes: ["minio_data:/minio_data"]

  # ========== 存储 ==========
  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mihc
      POSTGRES_PASSWORD: mihc123
      POSTGRES_DB: mihc
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  # ========== LLM 服务（vLLM Qwen3-32B，需 GPU；无 GPU 删掉本服务）==========
  vllm:
    image: vllm/vllm-openai:latest
    command: ["--model", "Qwen/Qwen3-32B", "--enable-lora",
              "--lora-modules", "mihc=/models/mihc-lora",
              "--served-model-name", "qwen3-32b-lora"]
    ports: ["8001:8000"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./models:/models
      - hf_cache:/root/.cache/huggingface

  # ========== 观测 ==========
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel-collector-config.yaml

  prometheus:
    image: prom/prometheus:v2.51.2
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: mihc123
      GF_INSTALL_PLUGINS: ""
    ports: ["3000:3000"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

  # ========== 应用（可选：直接容器化平台）==========
  # app:
  #   build: .
  #   ports: ["8000:8000"]
  #   env_file: .env
  #   depends_on: [elasticsearch, milvus, redis, postgres, mongo]

volumes:
  es_data:
  etcd_data:
  minio_data:
  pg_data:
  mongo_data:
  prom_data:
  grafana_data:
  hf_cache:
